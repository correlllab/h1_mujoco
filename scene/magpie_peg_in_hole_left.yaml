    # - {id: rectangle_2, shape: rectangle, size: 2, hole: rectangle_2}
    # - {id: rectangle_3, shape: rectangle, size: 3, hole: rectangle_3}
    # - {id: triangle_0, shape: triangle, size: 0, hole: triangle_0}
