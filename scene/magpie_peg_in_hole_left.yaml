# Left-arm fixture calibrated from the live standing robot on 2026-11-03.
# Read-only DDS measurement: pelvis world position (m)
# [-0.074005682981, -0.027101960939, 0.955172239917] (tick 122542).
# Ignore measured pelvis rotation: assume pelvis axes match global XYZ.
# Seated cylinder_1 TOP relative to that origin: [0.45, 0.225, 0.053].
# Table surface is level with the pelvis. Buried bottom tip is at Z = 0.003.
# Cylinder top: 0.053 seated, 0.075 after a 22 mm extraction lift.
# Easy box: X [0.40, 0.50], Y [0.125, 0.325], Z [0.050, 0.225].
# Gripper target RPY (deg): [0, 90, -60], NOT a board orientation.
# The table/board are world-fixed, level, and do not follow a moving pelvis.
version: 1
scene:
  xml: mujoco_assets/manipulation_net/workcell.xml
simulation:
  timestep: 0.001
table:
  enabled: true
  position: [0.503832018731, 0.185369815094, 0.0]
  quaternion: [1.0, 0.0, 0.0, 0.0]
  # 20 mm of support beyond each edge of the 320 x 250 mm board.
  size: [0.36, 0.29]
  height: 0.955172239917
  top_thickness: 0.04
  leg_width: 0.05
  leg_inset: 0.03
  rgba: [0.55, 0.40, 0.28, 1.0]
  friction: [0.8, 0.005, 0.0001]
board:
  enabled: true
  catalog: mujoco_assets/manipulation_net/manipulation_catalog.json
  collision: functional
  # collision: detailed  # Also collide with cosmetic engraved recesses.
  position_on_table: [0.0, 0.0, 0.0]
  quaternion: [1.0, 0.0, 0.0, 0.0]
  # Omitted insertion_depth means seated. Use 0.0 for the hole entry plane.
  # The calibration targets cylinder_1; other holes have different positions.
  pegs:
    - {id: cylinder_1, shape: cylinder, size: 1, hole: cylinder_1}
    # - {id: cylinder_0, shape: cylinder, size: 0, hole: cylinder_0}
    # - {id: cylinder_2, shape: cylinder, size: 2, hole: cylinder_2}
    # - {id: cylinder_3, shape: cylinder, size: 3, hole: cylinder_3}
